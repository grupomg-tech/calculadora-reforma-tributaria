name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * 1" # Mondays 08:00 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
